# Mock configuration for the next task: Fine-Tune Stylist Model.
# This file is intentionally safe to commit: it references environment variable names only,
# never Kaggle token values from .env.local.

task: fine_tune_stylist_model_mock
mode: mock_only
created_for: OutfitMatch v3.1-lite Conversational Stylist

# Llama Turbo Quant / llama.cpp is the inference + evaluation driver for GGUF.
# Actual QLoRA SFT should use trainable HF/Unsloth weights in 4-bit, then export/quantize to GGUF.
driver:
  name: llama_turbo_quant
  api_style: openai_compatible_chat_completions
  default_base_url: http://127.0.0.1:8080/v1
  default_quant: UD-Q4_K_XL
  deterministic_params:
    temperature: 0.1
    top_p: 0.8
    max_tokens: 700

# Kaggle execution is modeled as three isolated jobs/tokens: one model per token.
device:
  provider: kaggle_gpu
  env_file: .env.local
  token_env_vars:
    - KAGGLE_API_TOKEN_1
    - KAGGLE_API_TOKEN_2
    - KAGGLE_API_TOKEN_3

training:
  strategy: qlora_sft
  library_stack:
    - transformers
    - peft
    - bitsandbytes
    - accelerate
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  gradient_checkpointing: true
  packing: false
  max_seq_length: 4096
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 2
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    target_modules_strategy: auto_find_linear_layers_excluding_lm_head
  output_root: data/stylist/fine_tune/runs/qlora_outputs

# User-provided dataset folders. The mock script can create/check these directories.
dataset:
  root: data/stylist/fine_tune
  stylist_knowledge_dir: data/stylist/fine_tune/stylist_knowledge
  users_query_response_dir: data/stylist/fine_tune/users_query_and_response
  accepted_extensions:
    - .jsonl
    - .json
    - .parquet
    - .md
    - .txt
  target_training_format: chatml_jsonl
  required_training_fields:
    - messages
    - task_type
    - source_set

models:
  - run_id: qwen3vl8b_instruct_gguf
    kaggle_token_env: KAGGLE_API_TOKEN_1
    gguf_repo: unsloth/Qwen3-VL-8B-Instruct-GGUF
    gguf_selector: UD-Q4_K_XL
    trainable_base_model: Qwen/Qwen3-VL-8B-Instruct
    modality: image_text_to_text
    role: current_architecture_baseline
    qlora_recipe:
      adapter_scope: multimodal_chat
      tune_vision_tower: false
      tune_projector: true
      target_modules_hint:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
    notes:
      - Baseline aligned with existing OutfitMatch architecture.
      - Keep image understanding enabled for user outfit/body/occasion image prompts.

  - run_id: qwen35_9b_gguf
    kaggle_token_env: KAGGLE_API_TOKEN_2
    gguf_repo: unsloth/Qwen3.5-9B-GGUF
    gguf_selector: UD-Q4_K_XL
    trainable_base_model: Qwen/Qwen3.5-9B
    modality: image_text_to_text
    role: strongest_small_qwen35_candidate
    qlora_recipe:
      adapter_scope: multimodal_chat
      tune_vision_tower: false
      tune_projector: true
      target_modules_hint:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
    request_overrides:
      chat_template_kwargs:
        enable_thinking: false
    notes:
      - Prefer for schema/tool-calling benchmark because Qwen3.5 has explicit tool-parser serving recipes.
      - Disable thinking for strict JSON/tool extraction.

  - run_id: gemma4_12b_it_gguf
    kaggle_token_env: KAGGLE_API_TOKEN_3
    gguf_repo: unsloth/gemma-4-12b-it-GGUF
    gguf_selector: UD-Q4_K_XL
    trainable_base_model: google/gemma-4-12B-it
    modality: image_audio_text_to_text
    role: non_qwen_comparison
    qlora_recipe:
      adapter_scope: multimodal_chat
      tune_vision_tower: false
      tune_projector: true
      target_modules_hint:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj
    request_overrides:
      chat_template_kwargs:
        enable_thinking: false
    llama_server_flags:
      - --jinja
    notes:
      - Use as non-Qwen control for Vietnamese stylist tone and image perception.
      - Keep --jinja enabled for Gemma 4 chat template under llama.cpp/TurboQuant.

mock_pipeline:
  stages:
    - validate_dataset_folders
    - normalize_to_chatml_jsonl
    - base_model_turboquant_benchmark
    - qlora_sft_on_trainable_base_weights
    - merge_adapter_or_export_checkpoint
    - export_or_select_gguf_quant
    - post_tune_turboquant_benchmark
    - compare_three_models
  hard_gates:
    valid_tool_json_rate_min: 0.95
    enum_validity_rate_min: 0.99
    hallucinated_outfit_id_rate_max: 0.0
    vietnamese_response_rate_min: 0.98
    ask_missing_info_when_occasion_missing_rate_min: 0.90

outputs:
  mock_manifest: data/stylist/fine_tune/runs/mock_manifest.json
  normalized_train_jsonl: data/stylist/fine_tune/runs/train.mock.jsonl
  normalized_eval_jsonl: data/stylist/fine_tune/runs/eval.mock.jsonl
  benchmark_report: data/stylist/fine_tune/runs/benchmark_report.mock.md
