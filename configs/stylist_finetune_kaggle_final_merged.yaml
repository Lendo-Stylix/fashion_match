task: fine_tune_stylist_model_kaggle
mode: kaggle_qlora
created_for: OutfitMatch v3.1-lite Final Merged Stylist Bundle
kaggle:
  owner: nhatquangvominh
  dataset_slug: om-stylist-qlora-final-merged-data
  kernel_slug_prefix: om-sty-final
  machine_shape: NvidiaTeslaT4
  enable_gpu: true
  enable_internet: true
  is_private: true
secrets:
  allowed_hf_token_env_vars:
  - HF_API_TOKEN_2
  - HF_API_TOKEN_3
  forbidden_hf_token_env_vars:
  - HF_API_TOKEN_1
  - HF_TOKEN
  - HUGGINGFACE_TOKEN
dataset:
  source_mode: grounded_bundle
  root: data/stylist/fine_tune
  stylist_knowledge_dir: data/stylist/fine_tune/runs/stylist_grounded_v2/merged_source_gptoss_2800_core8800
  users_query_response_dir: data/stylist/fine_tune/users_query_and_response
  accepted_extensions:
  - .csv
  - .jsonl
  - .json
  - .md
  - .txt
  prefer_translated_columns: true
  eval_fraction: 0.03
  max_eval_records: 512
  seed: 42
  system_prompt: Bạn là AI stylist tiếng Việt của OutfitMatch cho thị trường Việt
    Nam. Trả lời ngắn gọn, thực tế, bám catalog thật, hỏi lại khi thiếu thông tin
    quan trọng, gọi đúng search_outfits khi cần, không bịa outfit_id, sản phẩm, giá,
    size hoặc tình trạng tồn kho.
training:
  framework: unsloth
  strategy: qlora_sft
  install_packages:
  - unsloth==2025.8.5
  - unsloth_zoo==2025.8.5
  - transformers==5.2.0
  - peft==0.19.1
  - accelerate==1.14.0
  - torch==2.4.0
  - torchvision==0.19.0
  - xformers==0.0.27.post2
  - bitsandbytes==0.49.2
  - trl==0.24.0
  - diffusers==0.35.2
  - datasets==3.6.0
  - huggingface_hub==1.3.7
  - wandb==0.23.0
  bootstrap_wheelhouse:
    enabled: true
    requirements:
    - unsloth==2025.8.5
    - unsloth_zoo==2025.8.5
    - transformers==5.2.0
    - peft==0.19.1
    - accelerate==1.14.0
    - torch==2.4.0
    - torchvision==0.19.0
    - xformers==0.0.27.post2
    - bitsandbytes==0.49.2
    - triton==3.2.0
    - trl==0.24.0
    - diffusers==0.35.2
    - datasets==3.6.0
    - huggingface_hub==1.3.7
    - wandb==0.23.0
    exclude_packages: []
    no_deps_packages:
    - unsloth
    - unsloth_zoo
    platform: manylinux2014_x86_64
    extra_platforms:
    - manylinux_2_24_x86_64
    python_version: '3.12'
    implementation: cp
    abi: cp312
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: float16
  max_seq_length: 2048
  packing: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 1
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 100
  save_steps: 250
  save_total_limit: 2
  ddp:
    enabled: true
    backend: torchrun
    ddp_find_unused_parameters: false
    effective_batch_size_note: per_device_train_batch_size * visible_gpus * gradient_accumulation_steps
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  output_root: /kaggle/working/outfitmatch_stylist_qlora
  report_to:
  - wandb
  max_session_steps: 250
  wandb:
    project: outfitmatch-stylist
    entity: vominhnhatquang-fpt-university
    kaggle_secret_name: WANDB_API_KEY
    checkpoint_artifact_name: outfitmatch-{run_id}-checkpoint
models:
- run_id: qwen3vl8b_instruct
  hf_token_env: HF_API_TOKEN_2
  base_model: unsloth/Qwen3-VL-8B-Instruct
  preferred_unsloth_4bit_model: unsloth/Qwen3-VL-8B-Instruct-bnb-4bit
  gguf_repo: unsloth/Qwen3-VL-8B-Instruct-GGUF
  modality: image_text_to_text
  role: final_merged_baseline
  notes:
  - Fine-tune language/projector adapter only; keep vision tower frozen.
  - Public Unsloth model; allow training even if Kaggle HF secret is absent.
  requires_hf_token: false
- run_id: qwen3vl8b_thinking
  hf_token_env: HF_API_TOKEN_2
  base_model: unsloth/Qwen3-VL-8B-Thinking
  preferred_unsloth_4bit_model: unsloth/Qwen3-VL-8B-Thinking-bnb-4bit
  gguf_repo: unsloth/Qwen3-VL-8B-Thinking-GGUF
  modality: image_text_to_text
  role: reasoning_variant_candidate
  request_overrides:
    chat_template_kwargs:
      enable_thinking: false
  notes:
  - Keep downstream inference in non-thinking mode for strict tool-call formatting.
  - Public Unsloth model; allow training even if Kaggle HF secret is absent.
  requires_hf_token: false
- run_id: qwen35_9b
  hf_token_env: HF_API_TOKEN_3
  base_model: unsloth/Qwen3.5-9B
  preferred_unsloth_4bit_model: unsloth/Qwen3.5-9B
  gguf_repo: unsloth/Qwen3.5-9B-GGUF
  modality: image_text_to_text
  role: strongest_text_candidate
  request_overrides:
    chat_template_kwargs:
      enable_thinking: false
  notes:
  - Disable thinking during downstream strict JSON/tool extraction.
  - Public Unsloth model; allow training even if Kaggle HF secret is absent.
  requires_hf_token: false
outputs:
  package_root: data/stylist/fine_tune/runs/kaggle_qlora_final_merged
  normalized_train_jsonl: data/stylist/fine_tune/runs/kaggle_qlora_final_merged/kaggle_dataset/train.jsonl
  normalized_eval_jsonl: data/stylist/fine_tune/runs/kaggle_qlora_final_merged/kaggle_dataset/eval.jsonl
  manifest: data/stylist/fine_tune/runs/kaggle_qlora_final_merged/manifest.json
