[project]
name = "outfitmatch"
version = "0.1.0"
description = "Body & Occasion-Aware Fashion Recommender — DPL302m grading project"
requires-python = ">=3.13"
dependencies = [
    # PyTorch ecosystem
    "torch>=2.12",
    "torchvision>=0.26",
    # HuggingFace
    "open-clip-torch>=2.26",
    "transformers>=4.52",
    "datasets>=3.2",
    "huggingface-hub>=0.30",
    "safetensors>=0.5",
    "accelerate>=1.4",
    "peft>=0.14",
    # Vision — NO mediapipe (no cp313 wheel)
    "ultralytics>=8.3",
    "pillow>=11.0",
    "opencv-python>=4.11",
    "timm>=1.0",
    "einops>=0.8",
    # Vector store — NO faiss-cpu pip (no cp313 wheel); use qdrant
    "qdrant-client>=1.12",
    # Data / numerics
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "albumentations>=2.0",
    "pyarrow>=18.0",
    "tqdm>=4.67",
    # Config & CLI
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    # Experiment tracking & MLOps
    "wandb>=0.19",
    "dvc[s3]>=3.56",
    # Weak supervision (occasion labeling)
    "google-generativeai>=0.8",
    "openai>=1.57",
    "tenacity>=9.0",
    "diskcache>=5.6",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    # Demo
    "gradio>=5.9",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[project.scripts]
om-exp = "outfitmatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outfitmatch"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
